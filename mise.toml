#:schema https://mise.jdx.dev/schema/mise.json

min_version = "2026.10.4"

[settings]
lockfile = true
experimental = true
idiomatic_version_file_enable_tools = ["node", "pnpm"]

[tools]
fnox = { version = "latest", workflow = "release.yml" }
hk = { version = "2.7.0", workflow = "release.yml" }

[env]
NODE_ENV = { default = "development" }
_.path = ["{{config_root}}/node_modules/.bin"]

[secrets.fnox]

[tasks.install]
description = "Install the locked npm dependency tree"
alias = "i"
run = "pnpm install"
sources = ["mise.toml", "package.json", "pnpm-lock.yaml"]
outputs = ["node_modules/.pnpm/lock.yaml"]

[tasks.dev]
description = "Start the local dev server"
alias = "d"
run = "pnpm run dev"
depends = ["install"]
